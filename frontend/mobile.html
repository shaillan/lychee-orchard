<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#1f6f4a">
<title>智慧果园管家</title>
<link rel="stylesheet" href="/assets/css/mobile.css">
</head>
<body>
<div class="shell">
  <header class="navbar">
    <button class="nav-back hidden" id="navBack" onclick="history.back()" aria-label="返回">‹</button>
    <span class="nav-title" id="navTitle">智慧果园管家</span>
  </header>

  <main class="content" id="content">
    <div class="view" id="view-todo"></div>
    <div class="view hidden" id="view-plots"></div>
    <div class="view hidden" id="view-plot"></div>
    <div class="view hidden" id="view-scan"></div>
    <div class="view hidden" id="view-form"></div>
    <div class="view hidden" id="view-trace"></div>
    <div class="view hidden" id="view-batches"></div>
    <div class="view hidden" id="view-kb"></div>
    <div class="view hidden" id="view-kbDetail"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="todo"><span class="ico">📋</span>今日待办</button>
    <button data-tab="plots"><span class="ico">🌳</span>我的果园</button>
    <button data-tab="scan"><span class="ico">📷</span>拍照识别</button>
    <button data-tab="form"><span class="ico">✍️</span>快速填报</button>
  </nav>
</div>

<div id="toast"></div>
<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="field">
      <input id="modalInput" placeholder="">
    </div>
    <div class="row">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script src="/assets/js/mobile.js"></script>
</body>
</html>
