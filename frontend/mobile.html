<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>智慧果园管家</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1>智慧果园管家</h1>
      <div class="sub">东风荔枝果园 · 从田间到餐桌</div>
    </div>
    <button class="pill neutral" id="fontToggle" onclick="toggleFont()" style="margin-right:6px;border:none;cursor:pointer;font-family:inherit">大字</button>
    <a class="pill neutral" href="/trace?code=LZ-P03-20260702-0001" style="text-decoration:none;margin-right:8px">溯源</a>
    <a class="pill neutral" href="/dashboard" style="text-decoration:none">看板</a>
  </div>

  <div class="content">
    <!-- 今日待办 -->
    <div id="view-todo">
      <div class="card" id="regionCard">
        <h2>天气地区</h2>
        <div class="small muted" id="regionNow">当前：加载中…</div>
        <label class="field mt"><span>地区名（如 广州）</span>
          <input id="regionInput" placeholder="输入城市名，如 广州">
        </label>
        <button class="btn block" id="regionBtn" onclick="saveRegion()">保存地区</button>
        <div id="regionMsg" class="mt"></div>
      </div>
      <div id="todoList"></div>
    </div>
    <!-- 我的果园 -->
    <div id="view-plots" class="hidden"></div>
    <!-- 拍照识别 -->
    <div id="view-scan" class="hidden"></div>
    <!-- 快速填报 -->
    <div id="view-form" class="hidden"></div>
  </div>

  <div class="tabbar">
    <button class="active" data-tab="todo"><span class="ico">📋</span>今日待办</button>
    <button data-tab="plots"><span class="ico">🌳</span>我的果园</button>
    <button data-tab="scan"><span class="ico">📷</span>拍照识别</button>
    <button data-tab="form"><span class="ico">✍️</span>快速填报</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
// 10 秒超时：后端卡住时不要一直转圈，直接走错误态 + 重试
function fetchT(u, opts){
  if(typeof AbortSignal !== 'undefined' && AbortSignal.timeout) return fetch(u, Object.assign({signal:AbortSignal.timeout(10000)}, opts||{}));
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), 10000);
  return fetch(u, Object.assign({signal:c.signal}, opts||{})).finally(()=>clearTimeout(t));
}
const api = {
  async get(u){ const r = await fetchT(u); if(!r.ok) throw new Error((await r.json()).detail||r.status); return r.json(); },
  async post(u, body, isForm){ const r = await fetchT(u, { method:'POST', headers: isForm?undefined:{'Content-Type':'application/json'}, body: isForm?body:JSON.stringify(body) }); if(!r.ok) throw new Error((await r.json()).detail||r.status); return r.json(); },
  async put(u, body){ const r = await fetchT(u, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); if(!r.ok) throw new Error((await r.json()).detail||r.status); return r.json(); }
};
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 识别来源：mock_fallback 要区分「没配 Key」和「云端调用失败」
const sourceText = r => {
  const s = String(r.source || '').split('#')[0];  // 去掉 #confirm_false 之类的内部后缀
  if (s === 'demo') return '演示模式';
  if (s.indexOf('mock_fallback') === 0) return '云端调用失败，已降级本地模拟';
  if (r.is_mock) return '本地模拟（未配置 AI Key）';
  return s;
};

const levelCls = { good:'good', warning:'warning', serious:'serious', critical:'critical' };

/* ---------- 适老化大字模式 ---------- */
function applyFont(){
  const on = localStorage.getItem('fontLarge') === '1';
  document.documentElement.classList.toggle('font-lg', on);
  const b = $('#fontToggle');
  if(b) b.textContent = on ? '标准' : '大字';
}
function toggleFont(){
  const on = document.documentElement.classList.toggle('font-lg');
  localStorage.setItem('fontLarge', on ? '1' : '0');
  applyFont();
}

function switchTab(tab){
  $$('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ['todo','plots','scan','form'].forEach(t=>$('#view-'+t).classList.toggle('hidden', t!==tab));
  if(tab==='todo'){ loadRegion(); loadTodos(); }
  if(tab==='plots') loadPlots();
  if(tab==='scan') loadPests();
  if(tab==='form') loadFormPlots();
}
$$('.tabbar button').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));

/* ---------- 天气地区 ---------- */
async function loadRegion(){
  const now = $('#regionNow');
  if(!now) return;
  try {
    const info = await api.get('/api/weather/region');
    const r = info.region || {};
    const label = r.label || r.name || '未设置';
    now.textContent = '当前：' + label + (r.source === 'db' ? '（自定义）' : '（默认，来自 .env）');
  } catch(e){ now.textContent = '当前：地区信息加载失败'; }
}

async function saveRegion(){
  const btn = $('#regionBtn'), msg = $('#regionMsg');
  const name = ($('#regionInput').value || '').trim();
  if(!name){
    msg.innerHTML = '<div class="alert critical"><div class="al-detail">请输入地区名</div></div>';
    return;
  }
  btn.disabled = true;
  msg.innerHTML = '<div class="small muted">解析并保存中…</div>';
  try {
    const res = await api.put('/api/weather/region', { name });
    const r = res.region || {};
    $('#regionInput').value = '';
    msg.innerHTML = `<div class="alert good"><div class="al-detail">已设置：${esc(r.label || r.name)}</div></div>`;
    await loadRegion();
    await loadTodos();
  } catch(e){
    msg.innerHTML = `<div class="alert critical"><div class="al-detail">${esc(e.message)}</div></div>`;
  } finally { btn.disabled = false; }
}

/* ---------- 今日待办 ---------- */
async function loadTodos(){
  const el = $('#todoList');
  try {
    const items = await api.get('/api/todos');
    el.innerHTML = items.map(i=>`
      <div class="alert ${levelCls[i.level]||'neutral'}">
        <div class="al-title">${esc(i.title)}</div>
        <div class="al-detail">${esc(i.detail)}</div>
        ${i.type==='recognition'
          ? '<button class="btn ghost small" style="margin-top:8px" onclick="goRecognition()">去处置</button>'
          : (i.type==='weather'
              ? '<button class="btn ghost small" style="margin-top:8px" onclick="switchTab(\'scan\')">去拍照识别</button>'
              : (i.action ? `<button class="btn ghost small" style="margin-top:8px" onclick="goTodoAction('${esc(i.type||'')}', ${Number(i.plot_id)||0})">${esc(i.action)}</button>` : ''))}
      </div>`).join('');
  } catch(e){ el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
}

/* 待办动作：查看用药台账 / 去填报 / 查看批次 / 采收窗口 / 冷链 / 检测 */
function goTodoAction(type, plotId){
  if(type === 'safety' || type === 'batch' || type === 'coldchain' ||
     type === 'residue' || type === 'harvest' || type === 'crack'){
    plotId ? goPlotDetail(plotId) : switchTab('plots'); return;
  }
  if(type === 'operation'){ switchTab('form'); return; }
}

function goPlotDetail(id){
  window._focusPlot = id;
  switchTab('plots');
}

/* ---------- 我的果园 ---------- */
async function loadPlots(){
  const el = $('#view-plots');
  try {
    const plots = await api.get('/api/plots');
    el.innerHTML = plots.map(p=>{
      const s = p.safety;
      const pill = s.safe ? '<span class="pill good"><span class="dot"></span>可采收</span>'
        : `<span class="pill critical"><span class="dot"></span>还需 ${s.remaining_days} 天</span>`;
      const m = p.maturity || {};
      const mCls = m.status==='最佳' ? 'good' : (m.status==='已过' ? 'critical' : (m.status==='临近' ? 'warning' : 'neutral'));
      const mPill = m.status ? `<span class="pill ${mCls}"><span class="dot"></span>采收期：${esc(m.status)}</span>` : '';
      return `<div class="card" style="cursor:pointer" onclick="openPlot(${p.id})">
        <h2>${esc(p.name)} ${pill} ${mPill}</h2>
        <div class="kv"><span class="k">品种</span><span class="v">${esc(p.variety)}</span></div>
        <div class="kv"><span class="k">面积 / 株数</span><span class="v">${p.area_mu} 亩 · ${p.tree_count} 株</span></div>
        <div class="kv"><span class="k">定植年份</span><span class="v">${p.planting_year}</span></div>
        <div class="kv"><span class="k">位置</span><span class="v">${esc(p.location)}</span></div>
      </div>`;
    }).join('');
    // 从待办跳过来时，列表渲染完再定向打开该地块
    if(window._focusPlot){ const id = window._focusPlot; window._focusPlot = null; openPlot(id); }
  } catch(e){ el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
}

async function openPlot(id){
  const el = $('#view-plots');
  el.innerHTML = '<div class="card">加载中…</div>';
  try {
    const p = await api.get('/api/plots/'+id);
    const s = p.safety;
    const voidTag = o => o.voided_at ? ' <span class="pill neutral">已作废</span>' : '';
    const voidNote = o => o.voided_at ? `<div class="li-desc">作废原因：${esc(o.void_reason||'')}</div>` : '';
    const ops = p.operations.slice(0,8).map(o=>`<div class="list-item"><div class="li-main"><div class="li-title">${esc(o.operation_type)}${voidTag(o)}</div><div class="li-desc">${esc(o.operator)} · ${o.operation_date}</div>${voidNote(o)}</div></div>`).join('');
    const psts = p.pesticides.slice(0,5).map(r=>`<div class="list-item"><div class="li-main"><div class="li-title">${esc(r.pesticide_name)}${voidTag(r)}</div><div class="li-desc">${r.apply_time} · 安全间隔期 ${r.safe_interval_days} 天</div>${voidNote(r)}</div></div>`).join('');

    // 采收窗口：纯日历规则；成熟度观察只作为佐证展示
    const m = p.maturity || {};
    const mCls = m.status==='最佳' ? 'good' : (m.status==='已过' ? 'critical' : (m.status==='临近' ? 'warning' : 'neutral'));
    const mAux = m.status==='临近'
      ? `<div class="kv"><span class="k">距窗口开始</span><span class="v">${m.days_to_start} 天</span></div>`
      : (m.status==='最佳'
        ? `<div class="kv"><span class="k">窗口剩余</span><span class="v">${m.days_remaining} 天</span></div>`
        : (m.status==='已过'
          ? `<div class="kv"><span class="k">已过窗口</span><span class="v">${m.days_overdue} 天</span></div>` : ''));
    const maturityCard = m.window_start ? `
      <div class="card">
        <h2>采收窗口 <span class="pill ${mCls}"><span class="dot"></span>${esc(m.status)}</span></h2>
        <div class="kv"><span class="k">最佳采收期</span><span class="v">${m.window_start} ~ ${m.window_end}</span></div>
        <div class="kv"><span class="k">当前物候期</span><span class="v">${esc(m.phenology||'')}</span></div>
        ${mAux}
        ${m.label?`<div class="small muted mt">${esc(m.label)}</div>`:''}
      </div>` : '';
    const lastCheckOp = (p.operations||[]).find(o=>o.operation_type==='成熟度观察');
    let lastCheck = '';
    if(lastCheckOp){
      let d = {};
      try { d = JSON.parse(lastCheckOp.detail || '{}') || {}; } catch(e){ d = {}; }
      lastCheck = `<div class="small mt">最近观察：成熟度 ${d.ripeness ?? '—'}% · ${esc(lastCheckOp.operation_date)} · ${esc(lastCheckOp.operator||'')}${d.note?`<br>${esc(d.note)}`:''}</div>`;
    }

    el.innerHTML = `
      <button class="btn ghost small" onclick="loadPlots()">← 返回</button>
      <div class="card mt">
        <h2>${esc(p.name)} <span class="pill ${s.safe?'good':'critical'}"><span class="dot"></span>${s.safe?'可采收':'间隔期内'}</span></h2>
        <div class="kv"><span class="k">品种</span><span class="v">${esc(p.variety)}</span></div>
        <div class="kv"><span class="k">面积 / 株数</span><span class="v">${p.area_mu} 亩 · ${p.tree_count} 株</span></div>
        <div class="kv"><span class="k">位置</span><span class="v">${esc(p.location)}</span></div>
        ${s.safe?'':`<div class="alert critical mt"><div class="al-title">用药安全间隔期内</div><div class="al-detail">${esc(s.message)}</div></div>`}
      </div>
      ${maturityCard}
      ${lastCheck?`<div class="card">${lastCheck}</div>`:''}
      <div class="card"><h2>最近农事记录</h2>${ops||'<div class="muted">暂无记录</div>'}</div>
      <div class="card"><h2>最近用药台账</h2>${psts||'<div class="muted">暂无记录</div>'}</div>`;
  } catch(e){ el.innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
}

/* ---------- 拍照识别 ---------- */
let pestsCache = [];
let scanPlots = [];
async function loadPests(){
  try { pestsCache = await api.get('/api/pests'); } catch(e){}
  try { scanPlots = await api.get('/api/plots'); } catch(e){ scanPlots = []; }
  renderScan();
  loadRecognitionHistory();
}
function renderScan(){
  const el = $('#view-scan');
  const opts = pestsCache.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}（${esc(p.kind)}）</option>`).join('');
  el.innerHTML = `
    <div class="card">
      <h2>拍照识别病虫害</h2>
      <div class="photo-drop" onclick="$('#fileInput').click()">📷 点击拍照 / 选择图片<br><span class="small">客户端将压缩后上传识别</span></div>
      <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="uploadPhoto(this)">
      <label class="field"><span>地块（处置时把处置记录写入该地块台账）</span>
        <select id="scanPlot">${scanPlots.map(p=>`<option value="${p.id}">${esc(p.name)}（${esc(p.variety)}）</option>`).join('')}</select>
      </label>
      <img id="photoPreview">
      <div id="scanResult"></div>
    </div>
    <div class="card">
      <h2>演示模式（无需图片，按类别识别）</h2>
      <label class="field"><span>选择病虫害类别</span>
        <select id="demoPest">${opts}</select>
      </label>
      <label class="field"><span>预计距采收天数（可选，用于安全间隔期校验）</span>
        <input id="demoDays" type="number" placeholder="如 5 表示 5 天后采收">
      </label>
      <button class="btn block" onclick="runDemo()">生成识别结果与防治建议</button>
    </div>
    <div class="card" id="historyCard">
      <h2>识别记录 <button class="btn ghost small" onclick="loadRecognitionHistory()">刷新</button></h2>
      <div id="recognitionHistory"><span class="muted small">加载中…</span></div>
    </div>`;
}

/* ---------- 识别记录（补上闭环的另一端） ---------- */
const STATUS_TEXT = { pending:'待处置', handled:'已处置', ignored:'已忽略', false_positive:'误判' };
const STATUS_CLS = { pending:'critical', handled:'good', ignored:'neutral', false_positive:'neutral' };
let recognitionCache = {};

function parseSuggestion(r){
  if (r && r.suggestion && typeof r.suggestion === 'object') return r.suggestion;
  try { return JSON.parse((r && r.suggestion_json) || '{}') || {}; } catch(e){ return {}; }
}

function goRecognition(){
  window._focusHistory = true;
  switchTab('scan');
}

async function loadRecognitionHistory(){
  const box = $('#recognitionHistory');
  if(!box) return;
  try {
    const rows = await api.get('/api/recognitions?limit=20');
    recognitionCache = {};
    rows.forEach(r => { recognitionCache[r.id] = r; });
    const sorted = rows.slice().sort((a,b)=> (a.status==='pending'?0:1) - (b.status==='pending'?0:1));
    box.innerHTML = sorted.length ? sorted.map(r=>{
      const s = parseSuggestion(r);
      const when = String(r.created_at||'').replace('T',' ').slice(0,16);
      const conf = r.confidence != null ? (r.confidence*100).toFixed(0)+'%' : '—';
      return `<div class="list-item" style="cursor:pointer" onclick="showHistoryRecognition(${r.id})">
        <div class="li-main">
          <div class="li-title">${esc(r.detected_class || s.pest_class || '未知')}</div>
          <div class="li-desc">${esc(r.plot_name || '未指定地块')} · ${when} · 置信度 ${conf}</div>
        </div>
        <div class="li-side">
          <span class="pill ${STATUS_CLS[r.status]||'neutral'}"><span class="dot"></span>${STATUS_TEXT[r.status]||r.status}</span>
        </div>
      </div>`;
    }).join('') : '<div class="muted small">暂无识别记录，先拍一张或试试演示模式</div>';
  } catch(e){
    box.innerHTML = `<div class="alert critical"><div class="al-detail">识别记录加载失败：${esc(e.message)}</div></div>`;
  }
  if (window._focusHistory){
    window._focusHistory = false;
    const card = $('#historyCard');
    if(card) card.scrollIntoView({ behavior:'smooth', block:'start' });
  }
}

function showHistoryRecognition(id){
  const r = recognitionCache[id];
  if(!r) return;
  const s = parseSuggestion(r);
  if(!s.pest_class) s.pest_class = r.detected_class || '未知';
  const view = { ...r, suggestion: s };
  showRecognition(view, $('#scanResult'));
  $('#scanResult').scrollIntoView({ behavior:'smooth', block:'start' });
}

async function uploadPhoto(input){
  const f = input.files[0]; if(!f) return;
  $('#photoPreview').src = URL.createObjectURL(f); $('#photoPreview').style.display='block';
  const fd = new FormData(); fd.append('file', f);
  const pid = $('#scanPlot') && $('#scanPlot').value;
  if(pid) fd.append('plot_id', pid);
  $('#scanResult').innerHTML = '<div class="card">识别中…</div>';
  try { showRecognition(await api.post('/api/recognitions', fd, true), $('#scanResult')); }
  catch(e){ $('#scanResult').innerHTML = `<div class="alert critical"><div class="al-title">识别失败</div><div class="al-detail">${esc(e.message)}</div></div>`; }
}

async function runDemo(){
  const pest = $('#demoPest').value;
  const days = $('#demoDays').value === '' ? null : parseInt($('#demoDays').value);
  const pid = $('#scanPlot') && $('#scanPlot').value;
  const el = $('#scanResult');
  el.innerHTML = '<div class="card">生成中…</div>';
  const body = {pest_class:pest, days_to_harvest:days};
  if(pid) body.plot_id = parseInt(pid);
  try { showRecognition(await api.post('/api/recognitions/demo', body), el); }
  catch(e){ el.innerHTML = `<div class="alert critical">${esc(e.message)}</div>`; }
}

function showRecognition(r, el){
  window._lastRecognition = r;
  const s = r.suggestion;
  const kindCls = s.kind==='无异常'?'good':(s.risk==='高'?'critical':(s.risk==='中高'?'serious':'warning'));
  const pestPills = (s.pesticides||[]).map(p=>`<span class="pill neutral">${esc(p.name)} · ${p.safe_interval_days}天</span>`).join(' ');
  const warns = (s.warnings||[]).map(w=>`<div class="alert serious mt"><div class="al-detail">${esc(w)}</div></div>`).join('');
  const canPesticide = !!(s.pesticides && s.pesticides.length);
  const pending = !r.status || r.status === 'pending';
  const actionLabel = { pesticide: '按建议用药', operation: '人工清除', ignore: '观察（暂不处理）', none: '无需处置' };
  const recommend = s.recommended_action || 'none';
  const btnCls = a => (recommend === a ? 'btn small' : 'btn ghost small');
  const recommendHtml = (recommend !== 'none' && s.action_reason)
    ? `<div class="alert ${recommend === 'pesticide' ? 'warning' : 'good'} mt">
         <div class="al-title">系统建议：${esc(actionLabel[recommend] || '')}</div>
         <div class="al-detail">${esc(s.action_reason)}</div>
       </div>` : '';
  const statusBadge = pending ? '' : `<div class="mt"><span class="pill good"><span class="dot"></span>已处置</span></div>`;
  // 知识库结构化字段（旧记录可能没有，全部兜底为空）
  const hostParts = (s.host_parts || []).join('、');
  const diff = s.differential || {};
  const confusable = (diff.confusable || []).join('、');
  const distinguishing = (diff.distinguishing || []).join('；');
  const nonChem = s.non_chemical || [];
  const verify = (s.verification || {}).status || '';
  const verifyText = { confirmed:'已通过', rejected:'未通过，已降级', unavailable:'复核不可用（保留首轮）' }[verify] || '';
  const verifyPill = verifyText
    ? `<span class="pill ${verify==='confirmed'?'good':(verify==='rejected'?'serious':'neutral')}">二次确认：${esc(verifyText)}</span>`
    : '';
  let actionButtons = '';
  if (pending && recommend === 'none') {
    actionButtons = `
        <button class="btn ghost small" onclick="handleRecognition(\'false_positive\')">误判</button>
        <button class="btn ghost small" onclick="handleRecognition(\'ignore\')">忽略</button>`;
  } else if (pending) {
    actionButtons = [
      canPesticide ? `<button class="${btnCls('pesticide')}" onclick="handleRecognition('pesticide')">按建议用药${recommend === 'pesticide' ? ' · 推荐' : ''}</button>` : '',
      `<button class="${btnCls('operation')}" onclick="handleRecognition('operation')">人工清除${recommend === 'operation' ? ' · 推荐' : ''}</button>`,
      `<button class="${btnCls('false_positive')}" onclick="handleRecognition('false_positive')">误判</button>`,
      `<button class="${btnCls('ignore')}" onclick="handleRecognition('ignore')">忽略${recommend === 'ignore' ? ' · 推荐' : ''}</button>`
    ].join('');
  }
  const actions = pending ? `
      <div class="mt">
        <div class="small muted" style="margin-bottom:6px">识别后处置（形成闭环，处置记录回链本次识别）</div>
        ${actionButtons}
      </div>` : statusBadge;
  el.innerHTML = `
    <div class="card mt">
      <h2>识别结果 <span class="pill ${kindCls}"><span class="dot"></span>${esc(s.pest_class)}</span></h2>
      <div class="kv"><span class="k">置信度</span><span class="v">${(r.confidence*100).toFixed(1)}%</span></div>
      <div class="kv"><span class="k">风险等级</span><span class="v">${esc(s.risk)}（${esc(s.kind)}）</span></div>
      ${hostParts ? `<div class="kv"><span class="k">危害部位</span><span class="v">${esc(hostParts)}</span></div>` : ''}
      <div class="mt small muted">${s.latin?esc(s.latin):''}</div>
      <div class="mt" style="white-space:pre-line">${esc(s.text)}</div>
      ${confusable ? `<div class="alert warning mt"><div class="al-title">易混淆：${esc(confusable)}</div><div class="al-detail">${esc(distinguishing)}</div></div>` : ''}
      ${nonChem.length ? `<div class="alert good mt"><div class="al-title">非化学措施</div><div class="al-detail">${nonChem.map(m=>`· ${esc(m)}`).join('<br>')}</div></div>` : ''}
      <div class="mt">${pestPills}</div>
      ${warns}
      ${recommendHtml}
      ${actions}
      <div class="mt small muted">识别来源：${esc(sourceText(r))} ${verifyPill}</div>
    </div>`;
}

async function handleRecognition(method){
  const r = window._lastRecognition;
  if(!r) return;
  const s = r.suggestion || {};
  const pesticide = (s.pesticides||[])[0];
  const body = { method };
  if(method === 'pesticide'){
    if(!pesticide) return;
    body.pesticide_name = pesticide.name;
    body.cas_no = pesticide.cas_no;
    body.dosage = pesticide.dosage_hint || '';
  } else if(method === 'operation'){
    body.operation_type = '人工清除';
    body.detail = { method: '人工清除', detected_class: s.pest_class };
  } else if(method === 'false_positive'){
    body.note = '人工判定为误判';
  } else {
    body.note = '暂不处理';
  }
  const el = $('#scanResult');
  el.innerHTML = '<div class="card">提交处置…</div>';
  try {
    const res = await api.post('/api/recognitions/'+r.id+'/handle', body);
    window._lastRecognition = Object.assign({}, r, { status: res.status });
    showRecognition(window._lastRecognition, el);
    let tip = '';
    if(res.summary && res.summary.safe_interval_days){
      tip = `<div class="alert good"><div class="al-title">已写入用药台账</div><div class="al-detail">${esc(res.summary.pesticide_name)} · 安全间隔期 ${res.summary.safe_interval_days} 天，${esc(res.summary.earliest_harvest_date)} 之后方可采收</div></div>`;
    } else if(res.summary && res.summary.operation_type){
      tip = `<div class="alert good"><div class="al-title">已写入农事记录</div><div class="al-detail">${esc(res.summary.operation_type)} · ${esc(res.summary.operation_date)}</div></div>`;
    }
    if(tip) el.insertAdjacentHTML('afterbegin', tip);
    loadRecognitionHistory();
  } catch(e){
    el.innerHTML = `<div class="alert critical"><div class="al-title">处置失败</div><div class="al-detail">${esc(e.message)}</div></div>`;
  }
}

/* ---------- 快速填报 ---------- */
async function loadFormPlots(){
  try { const plots = await api.get('/api/plots'); window._plots = plots; } catch(e){ window._plots=[]; }
  renderForm();
}
function renderForm(){
  const el = $('#view-form');
  const plotOpts = (window._plots||[]).map(p=>`<option value="${p.id}">${esc(p.name)}（${esc(p.variety)}）</option>`).join('');
  el.innerHTML = `
    <div class="card">
      <h2>农事记录填报</h2>
      <label class="field"><span>地块</span><select id="opPlot">${plotOpts}</select></label>
      <label class="field"><span>农事类型</span>
        <select id="opType"><option>施肥</option><option>灌溉</option><option>修剪</option><option>疏花疏果</option><option>巡检</option><option>清园</option></select>
      </label>
      <label class="field"><span>操作人</span><input id="opOperator" value="陈伯"></label>
      <label class="field"><span>备注（JSON 可空）</span><input id="opRemark" placeholder="如：复合肥 40kg 环状沟施"></label>
      <button class="btn block" onclick="submitOperation()">提交农事记录</button>
      <div id="opMsg" class="mt"></div>
    </div>
    <div class="card">
      <h2>用药台账录入（含 CAS 校验）</h2>
      <label class="field"><span>地块</span><select id="pstPlot">${plotOpts}</select></label>
      <label class="field"><span>农药名称</span><input id="pstName" list="pstList" placeholder="输入或选择，如 高效氯氟氰菊酯">
        <datalist id="pstList"></datalist></label>
      <label class="field"><span>CAS 编号（可选，用于校验）</span><input id="pstCas" placeholder="如 91465-08-6"></label>
      <label class="field"><span>距预计采收天数（可选）</span><input id="pstDays" type="number"></label>
      <button class="btn block" onclick="submitPesticide()">提交用药记录</button>
      <div id="pstMsg" class="mt"></div>
    </div>`;
  fetch('/api/pesticides').then(r=>r.json()).then(list=>{
    $('#pstList').innerHTML = list.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}（${p.category}）</option>`).join('');
  }).catch(()=>{});
}

async function submitOperation(){
  const plot_id = +$('#opPlot').value;
  const detail = { remark: $('#opRemark').value };
  try {
    await api.post('/api/operations', {plot_id, operation_type:$('#opType').value, operator:$('#opOperator').value, detail});
    $('#opMsg').innerHTML = '<div class="alert good">农事记录已提交 ✅</div>';
    $('#opRemark').value='';
  } catch(e){ $('#opMsg').innerHTML = `<div class="alert critical">${esc(e.message)}</div>`; }
}

async function submitPesticide(){
  const payload = { plot_id:+$('#pstPlot').value, pesticide_name:$('#pstName').value, cas_no:$('#pstCas').value };
  const d = $('#pstDays').value; if(d!=='') payload.days_to_harvest = parseInt(d);
  try {
    const r = await api.post('/api/pesticide-records', payload);
    $('#pstMsg').innerHTML = `<div class="alert ${r.warning?'warning':'good'}">${esc(r.warning||'用药记录已提交')} ✅<br><span class="small">最早可采收：${r.earliest_harvest_date}</span></div>`;
    $('#pstName').value=''; $('#pstCas').value=''; $('#pstDays').value='';
  } catch(e){ $('#pstMsg').innerHTML = `<div class="alert critical">${esc(e.message)}</div>`; }
}

applyFont();
switchTab('todo');
</script>
